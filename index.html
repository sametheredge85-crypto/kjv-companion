<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Read the King James Bible, search it, and compare scripture with scripture.">
  <meta name="theme-color" content="#6b3f1d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="KJV Harmony">
  <title>KJV Harmony</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header>
    <div class="brand-row">
      <button type="button" class="brand" id="home-btn">KJV Harmony</button>
      <button type="button" class="about-link" id="about-btn">About</button>
    </div>
    <form class="lookup" id="lookup-form" role="search">
      <label class="sr-only" for="q">Verse or word</label>
      <input id="q" name="q" type="search" enterkeyhint="search" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="John 3:16 or a word">
      <button type="submit">Open</button>
    </form>
  </header>

  <main id="main">
    <p class="lede">Opening the Bible...</p>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <nav class="tabbar" aria-label="Sections">
    <button type="button" data-go="read">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5.5h6.2A2.8 2.8 0 0 1 14 8.3V19a2.2 2.2 0 0 0-2.2-2.2H5z"/><path d="M19 5.5h-6.2A2.8 2.8 0 0 0 10 8.3V19a2.2 2.2 0 0 1 2.2-2.2H19z"/></svg>
      Read
    </button>
    <button type="button" data-go="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="M16 16l4 4"/></svg>
      Search
    </button>
    <button type="button" data-go="harmony">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4h8a3 3 0 0 1 3 3v13H8.5A3.5 3.5 0 0 0 5 16.5V6a2 2 0 0 1 2-2z"/><path d="M7 8h8M7 12h8"/></svg>
      Harmony
    </button>
    <button type="button" data-go="compare">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="7.5" height="16" rx="1.2"/><rect x="13.5" y="4" width="7.5" height="16" rx="1.2"/></svg>
      Compare
    </button>
    <button type="button" data-go="saved">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4h10a1 1 0 0 1 1 1v15l-6-3.2L6 20V5a1 1 0 0 1 1-1z"/></svg>
      Saved
    </button>
  </nav>

  <noscript>
    <p class="message">This Bible needs JavaScript turned on in the browser.</p>
  </noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
